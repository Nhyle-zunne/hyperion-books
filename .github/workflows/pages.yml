name: Publish Hyperion Books to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/backup_test.dart test/book_entry_test.dart test/paymongo_csv_test.dart test/paymongo_screen_test.dart test/paymongo_import_plan_test.dart test/accounting_books_test.dart test/business_analytics_test.dart test/business_workspace_test.dart test/expense_csv_test.dart test/tax_filing_test.dart test/bir_tax_calendar_test.dart test/operation_registers_test.dart test/books_ui_test.dart test/theme_mode_test.dart test/sales_import_test.dart test/sidebar_books_navigation_test.dart test/manual_sales_test.dart test/book_table_view_test.dart test/customer_billing_details_test.dart
      - run: flutter test --platform chrome --reporter expanded test/dashboard_layout_test.dart test/paymongo_repository_web_test.dart test/manual_sales_repository_web_test.dart
      - run: node scripts/test_loader.mjs
      - run: flutter build web --release --no-web-resources-cdn --base-href=/hyperion-books/
      - run: node scripts/make_sw.mjs build/web
      - run: find build/web -name '*.map' -delete
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: pages-${{ github.run_id }}-${{ github.run_attempt }}
