name: Validate Hyperion Books (local-only)
on:
  push:
  pull_request:
concurrency:
  group: hyperion-books-validate-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: node scripts/check_source.mjs
      - run: node scripts/test_loader.mjs
      - run: node --check scripts/make_sw.mjs
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/backup_test.dart test/book_entry_test.dart test/paymongo_csv_test.dart test/paymongo_screen_test.dart test/paymongo_import_plan_test.dart test/accounting_books_test.dart test/business_analytics_test.dart test/business_workspace_test.dart test/expense_csv_test.dart test/tax_filing_test.dart test/bir_tax_calendar_test.dart test/operation_registers_test.dart test/books_ui_test.dart test/theme_mode_test.dart test/sales_import_test.dart test/sidebar_books_navigation_test.dart test/manual_sales_test.dart test/book_table_view_test.dart test/customer_billing_details_test.dart test/invoice_customer_ui_test.dart
      - run: flutter test --reporter expanded --platform chrome test/dashboard_layout_test.dart test/paymongo_repository_web_test.dart test/manual_sales_repository_web_test.dart
      - name: Build Flutter Web for GitHub Pages subpath
        run: flutter build web --release --no-web-resources-cdn --base-href=/hyperion-books/
      - name: Build offline service worker
        run: node scripts/make_sw.mjs build/web
      - name: Inspect build output
        run: test -f build/web/index.html && test -f build/web/sw.js && test -f build/web/manifest.json
