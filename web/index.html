<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B294A">
  <meta name="description" content="Hyperion Books: payouts and expenses, saved offline on your device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hyperion Books">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Hyperion Books</title>
  <style>
    html,body{height:100%;margin:0;background:#f4f7fa;font-family:system-ui,-apple-system,sans-serif}
    #startup{position:fixed;inset:0;display:grid;place-items:center;color:#0b294a;font-weight:800}
  </style>
</head>
<body>
  <div id="startup">⚓ HYPERION BOOKS</div>
  <script>window.addEventListener('flutter-first-frame',function(){var el=document.getElementById('startup');if(el)el.remove();});</script>
  <script src="flutter_bootstrap.js" async></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function(error) {
          console.warn('Offline app shell not installed:', error);
        });
      });
    }
  </script>
</body>
</html>
