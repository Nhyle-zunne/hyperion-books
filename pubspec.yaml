name: hyperion_books
version: 0.3.0+2
description: Offline-first business records, dashboards, expense imports, books and backups.
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sembast: ^3.10.0
  file_selector: ^1.1.0
  sembast_web: ^2.4.6+1
  uuid: ^4.6.0
  intl: ^0.20.2
  excel: ^4.0.6
  file_saver: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
